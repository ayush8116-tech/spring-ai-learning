spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.completions-path=/chat/completions

spring.ai.openai.api-key=${OPENROUTER-API-KEY}

spring.ai.openai.chat.options.model=z-ai/glm-4.5-air:free

spring.output.ansi.enabled=always

logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %highlight(%-5level) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n